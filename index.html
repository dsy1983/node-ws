<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独一无二的静态页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: #00c6ff;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #00c6ff, 0 0 20px #0072ff; }
            to { text-shadow: 0 0 20px #00f2fe, 0 0 30px #4facfe; }
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            animation: float 10s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>独一无二</h1>
        <p>这是一个完全独立的静态 HTML 页面文件。无需依赖任何外部资源。</p>
        <button onclick="changeMessage()">点击改变内容</button>
        <div class="footer">© 2026 自定义静态页面</div>
    </div>

    <script>
        function changeMessage() {
            const messages = [
                "灵感来自代码的宇宙 ✨",
                "每一次刷新都是新的开始 🚀",
                "简单，但与众不同 🌌",
                "纯静态，也可以很酷 😎"
            ];
            const random = Math.floor(Math.random() * messages.length);
            document.querySelector('p').textContent = messages[random];
        }

        // 动态生成漂浮背景元素
        for (let i = 0; i < 6; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            const size = Math.random() * 120 + 60;
            circle.style.width = size + 'px';
            circle.style.height = size + 'px';
            circle.style.left = Math.random() * window.innerWidth + 'px';
            circle.style.top = Math.random() * window.innerHeight + 'px';
            circle.style.animationDuration = (Math.random() * 10 + 5) + 's';
            document.body.appendChild(circle);
        }
    </script>
</body>
</html>
